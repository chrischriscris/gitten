# What each fixture is, where it came from, and what shape it is.
#
# `small` is committed and hermetic: every headless perf check runs on it
# with no network and no $HOME. Everything under `real/` is fetched by
# `fixtures/fetch.sh` (or cloned beside the repo) and never committed.

[[fixture]]
name = "small"
path = "fixtures/small"
source = "fixtures/gen.sh 3000 6000 (seed 7, deterministic)"
rev = "6847ded"
commits = 3000
diff_lines = 5577
files = 36
bytes_log = 395096
bytes_diff = 221058
sha256_log = "1f883eb5464b4738ed1111ffc4d6f7a4177ded4076ef9f7d4dfe58664bef6b96"
sha256_diff = "e15d7746e8b97271e3590ba24b1aefe7acc16080ef0c31824afe1d76307a9fab"

# The rest are shape, not data: fetched by fixtures/fetch.sh, kept out of
# history. Line counts are what `bench` reports (hunk lines), from
# docs/measurements.md.

