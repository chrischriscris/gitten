# Everything that can be checked without opening a window — the CI half of
# ./check.sh. Two jobs, deliberately small:
#
#   test  — the correctness section of check.sh verbatim. Every one of these
#           crates is headless by design: core has no dependencies at all,
#           web's tests are payloads and row indexes, tui's screen is a cell
#           buffer. Ubuntu because it is cheap, and green here doubles as the
#           Linux canary for every crate but the window.
#   lint  — formatting and clippy, the same two commands ./.githooks/pre-commit
#           runs before a commit exists. Clippy type-checks the whole
#           workspace, so this is also the Linux canary that the old plain
#           `cargo check` job provided; see decision 0025.
#
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI artifacts are never debugged. Omitting line tables makes both caches
  # smaller without changing assertions, overflow checks or clippy.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The acquisition tests use this repository as their fixture: three
      # commits for the commit-limit test, including HEAD~1 for diff tests.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - uses: Swatinem/rust-cache@v2
        id: cache
      # One Cargo process compiles independent clients in parallel. An exact
      # cache hit contains every locked source, so it need not update indexes.
      - run: >-
          cargo test -q --locked
          -p gitten-core -p gitten-app -p gitten-web -p gitten-tui
        env:
          CARGO_NET_OFFLINE: ${{ steps.cache.outputs.cache-hit }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
        id: cache
      # The set Zed's own install script hands a Linux builder: gpui needs the
      # headers even to compile, and blade wants vulkan present. Cached
      # dependencies are already compiled; provision these only when Cargo has
      # work that can consult them.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig libfontconfig1-dev \
            libxcb1-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libudev-dev libvulkan-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CARGO_NET_OFFLINE: ${{ steps.cache.outputs.cache-hit }}
