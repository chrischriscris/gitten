# Everything that can be checked without opening a window — the CI half of
# ./check.sh. Five jobs:
#
#   test       — the correctness section of check.sh verbatim. Every one of
#                these crates is headless by design: core has no dependencies
#                at all, git's fixtures are throwaway repositories, web's
#                tests are payloads and row indexes, tui's screen is a cell
#                buffer. Ubuntu because it is cheap, and green here doubles as
#                the Linux canary for every crate but the window.
#   lint       — formatting and clippy, the same two commands
#                ./.githooks/pre-commit runs before a commit exists. Clippy
#                type-checks the whole workspace, so this is also the Linux
#                canary that the old plain `cargo check` job provided; see
#                decision 0025.
#   test-shell — the desktop crate's tests, the largest tested surface in the
#                repo and the only one that needs the GPUI Linux headers.
#   diffcheck  — the differs against git's own answer, on this repository's
#                own history — the differs-vs-git section of check.sh, gated
#                the same way the rest of it is. Needs the full clone `test`
#                deliberately avoids.
#   audit      — RUSTSEC advisories against the locked tree. Advisory, not a
#                gate; see the job below for why.
#
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI artifacts are never debugged. Omitting line tables makes both caches
  # smaller without changing assertions, overflow checks or clippy.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The acquisition tests use this repository as their fixture: three
      # commits for the commit-limit test, including HEAD~1 for diff tests.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - uses: Swatinem/rust-cache@v2
      # One Cargo process compiles independent clients in parallel.
      #
      # No CARGO_NET_OFFLINE, even on a cache hit — that was tried (4f201af)
      # and broke main within a day: the first run after a key change goes
      # online, builds green and saves a cache whose registry was missing
      # `notify`; every run after it restored that cache as a full match and
      # died in resolution before compiling a line. An online run re-checks
      # the index on a hit for seconds; offline turned an imperfect save into
      # a red main. A cache hit still skips all the compile work, which is
      # the part worth having.
      #
      # `gitten-git` is in this list and was missing from it for a long time.
      # It is the only crate that talks to a repository — `parse_raw`, the
      # `cat-file` batch protocol, untracked status, CRLF — and its tests build
      # their own scratch repositories, so they are as headless as the rest.
      # They passed the whole time; nothing ran them.
      - run: >-
          cargo test -q --locked
          -p gitten-core -p gitten-app -p gitten-git -p gitten-web -p gitten-tui

  diffcheck:
    runs-on: ubuntu-latest
    steps:
      # Diffcheck diffs real history: HEAD~4..HEAD and the whole history from
      # the root commit, so it needs the full clone the test job deliberately
      # avoids.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q --locked -p gitten-git --example diffcheck --release . HEAD~4..HEAD
      - run: cargo run -q --locked -p gitten-git --example diffcheck --release . "$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
        id: cache
      # The set Zed's own install script hands a Linux builder: gpui needs the
      # headers even to compile, and blade wants vulkan present. Cached
      # dependencies are already compiled; provision these only when Cargo has
      # work that can consult them.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig libfontconfig1-dev \
            libxcb1-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libudev-dev libvulkan-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        # Online for the same reason the test job is: see there.

  # The desktop crate's tests — the largest tested surface in the repo, and the
  # one the plain `test` job leaves out because it is the only crate that needs
  # the GPUI Linux headers. Clippy already proves these compile on ubuntu (see
  # `lint`); this runs them. Almost all are ordinary `#[test]` functions with no
  # window; the two `#[gpui::test]` cases are why the job opened under
  # continue-on-error — a headless GPUI run on ubuntu was unproven, and a
  # first-time flake should not have turned main red before the signal was
  # established. Observed green on its second run (the first died linking for
  # want of libxkbcommon-x11-dev), so it gates like the rest.
  test-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - uses: Swatinem/rust-cache@v2
      # Not gated on a cache hit, unlike lint's copy of this list: rust-cache
      # keys on the Cargo tree and knows nothing about apt, so a full match is
      # exactly the run that still needs these. The rlibs restore warm, the
      # final link is the first thing to consult the system .so files, and a
      # skipped install left rust-lld finding no xcb, fontconfig, freetype,
      # xkbcommon or xkbcommon-x11 — the second test-shell failure, one green
      # run after the first.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig libfontconfig1-dev \
            libxcb1-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev \
            libwayland-dev libudev-dev libvulkan-dev
      # One package beyond lint's list, and only here: linking the test binary
      # resolves `-lxkbcommon-x11`, which needs the unversioned .so symlink the
      # -dev package carries — the -0 runtime library alone leaves rust-lld
      # unable to find it.
      - run: cargo test -q --locked -p gitten-shell

  # RUSTSEC advisories against the locked tree. Advisory, not a gate: this repo
  # is ~99% transitive gpui dependencies, and a blocking job would turn main red
  # for an advisory in a crate nobody here can bump without moving the whole GPUI
  # pin. `continue-on-error` keeps the report a report — the summary shows a
  # yellow ✗ worth reading, not a red one that blocks a merge for something
  # unactionable. Promote it to a gate the day the dependency tree is ours to fix.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The binary is the whole tool; installing from crates.io is a minute cold
      # and cached after. `--locked` so the audit tool itself does not drift.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # `Cargo.lock` is what is audited, so no build and no Linux GPUI headers
      # are needed — just the resolved graph.
      - run: cargo audit
