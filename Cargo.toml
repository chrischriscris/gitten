[workspace]
resolver = "2"
members = ["core", "git", "shell"]

# GPUI unoptimized is unusably slow — path tessellation and text shaping are
# hot loops. Optimize every dependency even in dev builds, while keeping our own
# crates unoptimized so they stay debuggable and quick to rebuild. Costs one
# long rebuild the first time; after that `cargo run` is usable.
[profile.dev.package."*"]
opt-level = 3

# Our own crates too, lightly. The hot loop in a renderer *is* our code —
# graph.rs paints every frame — so leaving it at opt-level 0 keeps dev builds
# unusable no matter how optimized the dependencies are. Level 1 is most of the
# speed for a small hit to build time and still debuggable.
[profile.dev]
opt-level = 1
