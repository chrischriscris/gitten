[workspace]
resolver = "2"
members = ["app", "cli", "core", "git", "gui", "tui", "web"]

# GPUI unoptimized is unusably slow — path tessellation and text shaping are
# hot loops. Optimize every dependency even in dev builds, while keeping our own
# crates unoptimized so they stay debuggable and quick to rebuild. Costs one
# long rebuild the first time; after that `cargo run` is usable.
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: line tables for six hundred units cost
# codegen time, link time and gigabytes of target/ for backtraces nobody
# reads outside our own crates. Workspace members keep debug = 1 below.
debug = false

# Our own crates too, lightly. The hot loop in a renderer *is* our code —
# graph.rs paints every frame — so leaving it at opt-level 0 keeps dev builds
# unusable no matter how optimized the dependencies are. Level 1 is most of the
# speed for a small hit to build time and still debuggable.
[profile.dev]
opt-level = 1
# Unpacked dsym on macOS: the link leaves debug info in the object files
# instead of packing a .dSYM bundle on every save. Same backtraces, less link.
split-debuginfo = "unpacked"
# Line tables, not full DWARF: backtraces keep their file:line, six hundred
# units stop emitting debug info nothing reads outside a debugger.
debug = 1

# Release is incremental. `[profile.release]` ships without it, and the
# `./dev --release` loop paid for that on every save. It is on for every
# release build — `bundle`, `dump` and ./export share the cache — because
# cargo fingerprints incremental and whole-program builds identically: the
# flag is not in the freshness hash, so scoping it to the dev loop could not
# keep a shipped binary out of the incremental cache anyway, only add
# plumbing to hide that. Measured steady-state on a shell save, warm cache:
# see docs/measurements.md.
[profile.release]
incremental = true

# Cargo's own default is to leave compile-time-only code unoptimized; the
# blanket above defeated that for every crate in the tree. These run only
# while the build compiles — macro expansion, header generation — never in
# the shipped app, so optimizing them buys nothing and costs real minutes of
# cold build. Named pins outrank the "*" blanket; runtime deps stay at O3.
# Keep the list to crates verified absent from the runtime graph.
[profile.dev.package.syn]
opt-level = 1
debug = false
[profile.dev.package.serde_derive]
opt-level = 1
debug = false
[profile.dev.package.thiserror-impl]
opt-level = 1
debug = false
[profile.dev.package.derive_more-impl]
opt-level = 1
debug = false
[profile.dev.package.schemars_derive]
opt-level = 1
debug = false
[profile.dev.package.strum_macros]
opt-level = 1
debug = false
[profile.dev.package.gpui_macros]
opt-level = 1
debug = false
[profile.dev.package.cbindgen]
opt-level = 1
debug = false
[profile.dev.package.bindgen]
opt-level = 1
debug = false
